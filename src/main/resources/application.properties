# ---------------------------------------------------------------------------
# Persistence: H2 file-based database (zero external dependency, survives restart)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/finance;AUTO_SERVER=TRUE
quarkus.hibernate-orm.schema-management.strategy=update

# Tests run against an isolated in-memory H2 so they never touch the file DB.
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ---------------------------------------------------------------------------
# Demo-grade authentication: static, hard-coded users in config (NOT for production).
# Embedded identity store, plain-text passwords, single "user" role.
# ---------------------------------------------------------------------------
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=alice-pw
quarkus.security.users.embedded.users.bob=bob-pw
quarkus.security.users.embedded.users.carol=carol-pw
quarkus.security.users.embedded.roles.alice=user
quarkus.security.users.embedded.roles.bob=user
quarkus.security.users.embedded.roles.carol=user

# ---------------------------------------------------------------------------
# Form-based login: session cookie handled by Quarkus, no custom auth code.
# ---------------------------------------------------------------------------
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login-failed
quarkus.http.auth.form.landing-page=/transactions

# Public paths: the login pages, the form callback, framework/static assets, favicon.
quarkus.http.auth.permission.public.paths=/login,/login-failed,/j_security_check,/logout,/favicon.ico,/q/*
quarkus.http.auth.permission.public.policy=permit

# Everything else requires an authenticated user.
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
